<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>Beat Flow</title>

</head>

<body>

<div class="login-bg"></div>

<h1>Beat Flow</h1>

<div class="login-box">
<input id="username" type="text" placeholder="Seu nome"><br>
<input type="password" placeholder="Senha"><br>
<button onclick="login()">Entrar</button>
</div>

<div id="app">

<div class="layout">

<div class="sidebar">
<h1>Beat Flow</h1>
<p>Home</p>
<p>Curtidas</p>
<p>Playlist</p>
</div>

<div class="main">

<input id="search" class="search" placeholder="Buscar música">

<div id="songs"></div>

<div class="playlist">
<h3>Minha Playlist</h3>
<div id="playlist"></div>
</div>

</div>
</div>

<div class="player">

<img id="cover" class="cover">

<div>

<div id="title">Escolha uma música</div>

<div class="controls">
  <button onclick="prev()"><i class="fas fa-backward"></i></button>
  <button onclick="toggle()"><i class="fas fa-play"></i></button>
  <button onclick="next()"><i class="fas fa-forward"></i></button>
</div>

<div class="progress" onclick="seek(event)">
<div class="progress-bar" id="progress"></div>
</div>

</div>

<input type="range" id="volume" class="volume" min="0" max="1" step="0.01">

<audio id="audio"></audio>

</div>

</div>

<script>

/* LOGIN */

function login(){

const name=document.getElementById("username").value;

if(!name)return;

document.querySelector(".login-box").style.display="none";

document.querySelector(".login-bg").style.display="none";

document.getElementById("app").style.display="flex";

}

/* MUSICAS */

const songs=[

{title:"Anna Júlia",artist:"Los Hermanos",cover:"https://picsum.photos/200?1",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},

{title:"Tempo Perdido",artist:"Legião Urbana",cover:"https://picsum.photos/200?2",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},

{title:"Garota de Ipanema",artist:"Tom Jobim",cover:"https://picsum.photos/200?3",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},

{title:"Mas Que Nada",artist:"Jorge Ben Jor",cover:"https://picsum.photos/200?4",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},

{title:"Evidências",artist:"Chitãozinho & Xororó",cover:"https://picsum.photos/200?5",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},

{title:"Pais e Filhos",artist:"Legião Urbana",cover:"https://picsum.photos/200?6",file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"}

];

const audio=document.getElementById("audio");

let index=0;

const songsDiv=document.getElementById("songs");

/* RENDER MUSICA */

function renderSongs(list){

songsDiv.innerHTML="";

list.forEach((song,i)=>{

const div=document.createElement("div");

div.className="song";

div.innerHTML=`<span onclick="play(${i})">${song.title} - ${song.artist}</span>`;

songsDiv.appendChild(div);

});

}

function play(i){

index=i;

const song=songs[index];

audio.src=song.file;

audio.play();

document.getElementById("title").innerText=song.title;

document.getElementById("cover").src=song.cover;

}

function toggle(){

if(audio.paused)audio.play();

else audio.pause();

}

function next(){

index++;

if(index>=songs.length)index=0;

play(index);

}

function prev(){

index--;

if(index<0)index=songs.length-1;

play(index);

}

audio.ontimeupdate=()=>{

const percent=(audio.currentTime/audio.duration)*100;

document.getElementById("progress").style.width=percent+"%";

};

function seek(e){

const rect=e.target.getBoundingClientRect();

const pos=(e.clientX-rect.left)/rect.width;

audio.currentTime=pos*audio.duration;

}

document.getElementById("volume").oninput=e=>{

audio.volume=e.target.value;

}

document.getElementById("search").oninput=e=>{

const q=e.target.value.toLowerCase();

const filtered=songs.filter(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q));

renderSongs(filtered);

};

audio.onended=next;

renderSongs(songs);

</script>

</body>
</html>
